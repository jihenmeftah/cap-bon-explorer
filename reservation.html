<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cap Bon Explorer - Reservation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Cap Bon Explorer</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Accueil</a></li>
                <li class="nav-item"><a class="nav-link" href="activites.html">Activites</a></li>
                <li class="nav-item"><a class="nav-link" href="agenda.html">Agenda</a></li>
                <li class="nav-item"><a class="nav-link active" href="reservation.html">Reservation</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5 mb-5">

    <h1 class="text-center mb-4">Reserver une activite</h1>

    <form id="formReservation">

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">Nom</label>
                <input type="text" id="nom" class="form-control" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Prenom</label>
                <input type="text" id="prenom" class="form-control" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Telephone</label>
                <input type="tel" id="telephone" class="form-control" required pattern="[0-9]{8}">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Activite</label>
                <select id="activite" class="form-select" required>
                    <option value="">Choisir une activite</option>
                    <option value="20">Decouverte de la medina - 20 TND</option>
                    <option value="35">Atelier de poterie - 35 TND</option>
                    <option value="30">Parcours de Kerkouane - 30 TND</option>
                    <option value="25">Randonnee decouverte - 25 TND</option>
                    <option value="40">Circuit du littoral - 40 TND</option>
                    <option value="25">Peinture sur ceramique - 25 TND</option>
                    <option value="15">Decouverte d'un marche local - 15 TND</option>
                    <option value="30">Promenade photographique - 30 TND</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Date</label>
                <input type="date" id="date" class="form-control" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Nombre de participants</label>
                <input type="number" id="participants" class="form-control" min="1" max="6" value="1" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Type de reservation</label>
                <div>
                    <input type="radio" name="type" value="Individuelle" required> Individuelle
                    <input type="radio" name="type" value="Famille"> Famille
                    <input type="radio" name="type" value="Groupe"> Groupe
                </div>
            </div>

            <div class="col-12 mb-3">
                <label class="form-label">Remarque</label>
                <textarea id="remarque" class="form-control"></textarea>
            </div>

            <div class="col-12 mb-3">
                <input type="checkbox" id="acceptation" required>
                <label for="acceptation">J'accepte les conditions de reservation</label>
            </div>

        </div>

        <div class="card p-3 mb-3">
            <h4>Calcul du prix</h4>
            <p>Sous-total : <span id="sousTotal">0</span> TND</p>
            <p>Reduction : <span id="reduction">0</span> TND</p>
            <h5>Total : <span id="total">0</span> TND</h5>
        </div>

        <button type="submit" class="btn btn-primary">Confirmer la reservation</button>
        <button type="reset" class="btn btn-secondary">Effacer</button>

    </form>

    <div id="resultat" class="alert alert-success mt-4" style="display: none;"></div>

</div>

<footer class="text-white text-center p-3">
    <p>2026 Cap Bon Explorer - Tous droits reserves</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/reservation.js"></script>

</body>
</html>
